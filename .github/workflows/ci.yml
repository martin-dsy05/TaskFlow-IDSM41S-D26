
name: TaskFlow - Integracion Continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar sintaxis
        run: python -m compileall -q .

      - name: Ejecutar pruebas unitarias
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No existe una carpeta de pruebas."
          fi
          
      - name: Generar paquete de despliegue
        run: bash scripts/generar_despliegue.sh

      - name: Publicar paquete de liberación
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-release
          path: dist/taskflow.tar.gz

      - name: Verificar paquete de liberación
        run: |
          mkdir -p release
          tar -xzf dist/taskflow.tar.gz -C release
          cd release
          python -m compileall -q .
          echo "Paquete preparado y verificado correctamente"
